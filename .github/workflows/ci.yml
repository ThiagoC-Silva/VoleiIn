# Integração contínua (docs/stacks.md, seção 10.2; docs/trabalho-com-agente.md, 5).
# Roda os mesmos comandos da definição de pronto, em todo pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (dart analyze e flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Textos da interface (app_pt.arb)
        run: flutter gen-l10n

      - name: Geração de código (freezed e json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      # Nunca `flutter analyze`: o acento no caminho o quebra (ADR 0014).
      - name: Análise estática
        run: dart analyze

      - name: Testes unitários e de widget
        run: flutter test

      # Cenário D15: o fuso do aparelho não entra na conta (RN01).
      - name: Testes de formatação em outro fuso
        run: TZ=Asia/Tokyo flutter test test/core/format

  database:
    name: Banco (migrações e pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # O CI não faz login com Google, mas o config.toml cita a variável e o
      # start exige um valor (research R11 de specs/001-conta-e-perfil).
      - name: Sobe o Supabase local
        run: supabase start
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-sem-google

      # As migrações acabaram de ser aplicadas em um banco limpo pelo start.
      - name: Lint do schema
        run: supabase db lint

      - name: Recria o banco com migrações e seed
        run: supabase db reset

      - name: Testes pgTAP
        run: supabase test db

      # Todos os testes Deno falam com o Supabase de pé: Storage (A01 a A13),
      # preview-invite servida pelo start (Q01 a Q07) e concorrência (C13 e C15)
      # (docs/arquitetura-app.md, 14.4; research R6 de specs/002-grupos). As
      # chaves são as do projeto local, geradas pelo próprio start; a secreta
      # conta linhas no Q07 e cria as contas da concorrência dos jogos, e o
      # JWT_SECRET assina os tokens dessas contas (research R7 de
      # specs/003-jogo-etapa-a).
      - name: Testes contra o Supabase local (Deno)
        working-directory: supabase/functions
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|JWT_SECRET)=')"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            SUPABASE_SECRET_KEY="$SECRET_KEY" SUPABASE_JWT_SECRET="$JWT_SECRET" \
            deno test --allow-net --allow-env

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatação
        run: deno fmt --check

      - name: Lint
        run: deno lint

      # Os testes das Edge Functions precisam do Supabase de pé e rodam no job
      # database (research R6 de specs/002-grupos). Aqui, só a checagem de tipos.
      - name: Tipos
        run: deno check preview-invite/index.ts
