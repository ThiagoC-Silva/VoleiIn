# Memória do build (setup.md, seção 3.1). O modelo do Flutter reserva 8 GB de
# heap, o que, somado ao emulador e ao Supabase local, esgotou a RAM de uma
# máquina de 16 GB e derrubou a sessão gráfica (13/11/2026). 3 GB bastam para
# este app; o Kotlin compila dentro do próprio Gradle, sem um segundo daemon, e
# o daemon do Gradle sai da memória depois de 10 minutos parado.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
